      <circle cx="18" cy="12" r="5"/>
      <line x1="6" y1="7" x2="18" y2="7"/>
      <line x1="6" y1="17" x2="18" y2="17"/>
      <circle cx="6" cy="12" r="1.5"/>
      <circle cx="18" cy="12" r="1.5"/>
