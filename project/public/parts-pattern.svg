      <line x1="11" y1="7" x2="11" y2="11"/>
      <line x1="13" y1="7" x2="13" y2="11"/>
      <rect x="8" y="11" width="8" height="12" rx="1"/>
      <line x1="10" y1="23" x2="10" y2="28"/>
      <line x1="14" y1="23" x2="14" y2="28"/>
