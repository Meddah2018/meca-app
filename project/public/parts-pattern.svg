<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <g fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.22">
    <!-- Piston -->
    <g transform="translate(60,50) rotate(-12) scale(0.9)">
      <rect x="6" y="14" width="12" height="18" rx="2"/>
      <line x1="12" y1="0" x2="12" y2="14"/>
      <circle cx="12" cy="4" r="2.5"/>
      <line x1="2" y1="22" x2="22" y2="22"/>
      <line x1="2" y1="27" x2="22" y2="27"/>
    </g>
    <!-- Brake disc -->
    <g transform="translate(200,80) rotate(8) scale(1.1)">
      <circle cx="12" cy="12" r="11"/>
      <circle cx="12" cy="12" r="5"/>
      <circle cx="12" cy="12" r="2"/>
      <line x1="12" y1="1" x2="12" y2="5"/>
      <line x1="12" y1="19" x2="12" y2="23"/>
      <line x1="1" y1="12" x2="5" y2="12"/>
      <line x1="19" y1="12" x2="23" y2="12"/>
    </g>
    <!-- Shock absorber -->
    <g transform="translate(380,40) rotate(-18) scale(0.85)">
      <rect x="9" y="2" width="6" height="6" rx="1"/>
      <line x1="12" y1="8" x2="12" y2="12"/>
