    <g transform="translate(520,340) rotate(10) scale(0.95)">
      <circle cx="12" cy="12" r="11"/>
      <circle cx="12" cy="12" r="7"/>
      <circle cx="12" cy="4" r="1.5"/>
      <circle cx="12" cy="20" r="1.5"/>
      <circle cx="4" cy="12" r="1.5"/>
      <circle cx="20" cy="12" r="1.5"/>
