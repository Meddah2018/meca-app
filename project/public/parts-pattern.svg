      <circle cx="5.5" cy="5.5" r="1.5"/>
    </g>
    <!-- Gear -->
    <g transform="translate(380,370) rotate(-5) scale(1.1)">
      <path d="M12 2 l1.5 3 h3 l-1 3 2.5 1.5 2.5-1.5 1 3 h3 l-1.5 3 1.5 3 h-3 l-1 3 -2.5-1.5 -2.5 1.5 -1-3 h-3 l1.5-3 -1.5-3 h3 l1-3 2.5 1.5 2.5-1.5 1 3 z"/>
