      <line x1="12" y1="26" x2="12" y2="30"/>
      <circle cx="12" cy="31" r="1.5"/>
    </g>
    <!-- Oil filter -->
    <g transform="translate(520,90) rotate(15) scale(1)">
      <rect x="5" y="4" width="14" height="22" rx="3"/>
      <line x1="5" y1="9" x2="19" y2="9"/>
      <line x1="5" y1="20" x2="19" y2="20"/>
      <circle cx="12" cy="14" r="3"/>
    </g>
    <!-- Battery -->
    <g transform="translate(100,200) rotate(5) scale(0.95)">
      <rect x="2" y="8" width="20" height="14" rx="1.5"/>
      <rect x="5" y="5" width="3" height="3"/>
      <rect x="16" y="5" width="3" height="3"/>
      <line x1="6.5" y1="14" x2="6.5" y2="17"/>
